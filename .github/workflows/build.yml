name: Build EDK2 UEFI

on:
  workflow_dispatch: # Позволяет запускать сборку вручную одной кнопкой

jobs:
  build-uefi:
    runs-on: ubuntu-22.04

    steps:
    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential uuid-dev iasl git nasm python3-distutils crossbuild-essential-armel gcc-aarch64-linux-gnu abootimg

    - name: Clone EDK2 base
      run: |
        git clone https://github.com/tianocore/edk2.git -b edk2-stable202405 --recursive ../edk2

    - name: Clone EDK2 platforms
      run: |
        git clone https://github.com/tianocore/edk2-platforms.git ../edk2-platforms

    - name: Checkout Current Repo
      uses: actions/checkout@v4
      with:
        path: edk2-msm8937

    - name: Compile EDK2 BaseTools
      run: |
        cd ../edk2
        make -C BaseTools

    - name: Run Firstrun Script
      run: |
        cd edk2-msm8937
        chmod +x scripts/firstrun.sh
        ./scripts/firstrun.sh

    - name: Build UEFI Image
      run: |
        cd edk2-msm8937
        export EDK_TOOLS_PATH=$GITHUB_WORKSPACE/edk2/BaseTools
        source ../edk2/edksetup.sh BaseTools
        
        chmod +x scripts/*.sh
        
        # Автоматический запуск: ищет сначала build.sh, затем build_device.sh или любой скрипт в папке
        if [ -f "./scripts/build.sh" ]; then
          ./scripts/build.sh
        elif [ -f "./scripts/build_device.sh" ]; then
          ./scripts/build_device.sh
        else
          # Если общего скрипта нет, запускаем первый попавшийся файл из папки scripts (например, конкретное устройство)
          ./scripts/$(ls scripts/ | grep .sh | head -n 1)
        fi

    - name: Upload Build Results
      uses: actions/upload-artifact@v4
      with:
        name: edk2-uefi-images
        path: |
          edk2-msm8937/*.img
          edk2-msm8937/*.bin
          edk2-msm8937/workspace/Build/**/*.fd
