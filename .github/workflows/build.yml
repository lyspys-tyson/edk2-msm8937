name: Build EDK2 UEFI (MSM8937/MSM8917)

on:
  workflow_dispatch:
    inputs:
      port_repo:
        description: "Репозиторий порта (owner/name)"
        required: false
        default: "vizPilot/edk2-msm8937"
        type: string
      port_ref:
        description: "Ветка/тег порта (пусто = ветка по умолчанию)"
        required: false
        default: ""
        type: string
      device:
        description: "Имя скрипта устройства из scripts/ без .sh, например santoni (пусто = собрать все)"
        required: false
        default: ""
        type: string
      build_args:
        description: "Доп. аргументы для скрипта сборки (например: -d DEVICE)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  GCC5_AARCH64_PREFIX: aarch64-linux-gnu-
  GCC5_ARM_PREFIX: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            uuid-dev \
            iasl \
            git \
            nasm \
            python3 \
            python3-distutils \
            crossbuild-essential-armel \
            crossbuild-essential-armhf \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            device-tree-compiler \
            bc \
            abootimg

      - name: Checkout edk2
        uses: actions/checkout@v4
        with:
          repository: tianocore/edk2
          ref: edk2-stable202405
          path: edk2
          submodules: false
          fetch-depth: 1

      - name: Checkout edk2-platforms
        uses: actions/checkout@v4
        with:
          repository: tianocore/edk2-platforms
          path: edk2-platforms
          submodules: false
          fetch-depth: 1

      - name: Checkout port repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.port_repo }}
          ref: ${{ inputs.port_ref }}
          path: edk2-msm8937
          submodules: false
          fetch-depth: 0

      - name: Init live edk2 submodules (skip broken subhook)
        working-directory: edk2
        shell: bash
        run: |
          set -Eeuo pipefail

          while read -r key url; do
            case "$url" in
              *subhook*)
                name="${key#submodule.}"
                name="${name%.url}"
                git config "submodule.${name}.update" none
                ;;
            esac
          done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.url$')

          git submodule update --init --recursive CryptoPkg/Library/OpensslLib/openssl || true
          git submodule update --init --recursive CryptoPkg/Library/MbedTlsLib/mbedtls || true
          git submodule update --init --recursive BaseTools/Source/C/BrotliCompress/brotli || true

          while IFS= read -r p; do
            case "$p" in
              *subhook*) continue ;;
            esac
            git submodule update --init --recursive "$p" || echo "::warning::не удалось инициализировать подмодуль $p"
          done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')

      - name: Init port submodules (best-effort)
        working-directory: edk2-msm8937
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f .gitmodules ]; then
            git submodule update --init --recursive || echo "::warning::не все подмодули порта удалось инициализировать"
          fi

      - name: Build BaseTools
        working-directory: edk2
        shell: bash
        run: |
          set -Eeuo pipefail
          make -C BaseTools

      - name: Build firmware
        working-directory: edk2-msm8937
        shell: bash
        env:
          DEVICE: ${{ inputs.device }}
          BUILD_ARGS: ${{ inputs.build_args }}
        run: |
          set -Eeuo pipefail
          touch "$GITHUB_WORKSPACE/.build-start"

          export EDK_TOOLS_PATH="$GITHUB_WORKSPACE/edk2/BaseTools"
          export PACKAGES_PATH="$GITHUB_WORKSPACE/edk2:$GITHUB_WORKSPACE/edk2-platforms:$GITHUB_WORKSPACE/edk2-msm8937"
          export WORKSPACE="$GITHUB_WORKSPACE/workspace"
          export CONF_PATH="$WORKSPACE/Conf"

          mkdir -p "$WORKSPACE" "$CONF_PATH"

          echo "::group::EDK2 setup"
          echo "WORKSPACE=$WORKSPACE"
          echo "CONF_PATH=$CONF_PATH"
          echo "EDK_TOOLS_PATH=$EDK_TOOLS_PATH"
          echo "PACKAGES_PATH=$PACKAGES_PATH"
          echo "::endgroup::"

          set +u
          source "$GITHUB_WORKSPACE/edk2/edksetup.sh" BaseTools
          set -u

          echo "::group::Содержимое репозитория порта"
          ls -la
          ls -la scripts 2>/dev/null || true
          echo "::endgroup::"

          run_script() {
            local s="$1"; shift
            echo "::group::Запуск $s $*"
            bash "$s" "$@"
            local rc=$?
            echo "::endgroup::"
            return $rc
          }

          read -r -a EXTRA_ARGS <<< "${BUILD_ARGS:-}"

          FIRSTRUN=""
          for f in scripts/firstrun.sh firstrun.sh; do
            if [ -f "$f" ]; then
              FIRSTRUN="$f"
              break
            fi
          done

          if [ -f scripts/build.sh ]; then
            run_script scripts/build.sh "${EXTRA_ARGS[@]}"
            exit $?
          elif [ -f build_device.sh ]; then
            run_script build_device.sh "${EXTRA_ARGS[@]}"
            exit $?
          else
            if [ -n "$FIRSTRUN" ]; then
              run_script "$FIRSTRUN"
            fi

            CANDIDATES=()
            if [ -n "${DEVICE:-}" ]; then
              for f in "scripts/$DEVICE.sh" "$DEVICE.sh" "scripts/$DEVICE"; do
                if [ -f "$f" ]; then
                  CANDIDATES=("$f")
                  break
                fi
              done
              if [ ${#CANDIDATES[@]} -eq 0 ]; then
                echo "::error::Скрипт устройства '$DEVICE' не найден (искал scripts/$DEVICE.sh, $DEVICE.sh, scripts/$DEVICE)"
                exit 1
              fi
            elif [ -f build.sh ]; then
              CANDIDATES=("build.sh")
            else
              while IFS= read -r f; do
                [ -n "$f" ] && CANDIDATES+=("$f")
              done < <(find scripts -maxdepth 1 -type f -name '*.sh' \
                ! -name 'firstrun.sh' \
                ! -name 'build_common.sh' \
                ! -name 'build_bootshim.sh' \
                -print | sort)
            fi

            if [ ${#CANDIDATES[@]} -eq 0 ]; then
              echo "::error::Не найден ни scripts/build.sh, ни build_device.sh, ни скрипты устройств в scripts/"
              ls -R . | head -100
              exit 1
            fi

            mkdir -p out
            BUILT=0

            for S in "${CANDIDATES[@]}"; do
              name=$(basename "$S" .sh)
              if run_script "$S" "${EXTRA_ARGS[@]}"; then
                BUILT=$((BUILT + 1))
                mkdir -p "out/$name"
                for f in ./*.img; do
                  if [ -f "$f" ]; then
                    cp -f "$f" "out/$name/"
                  fi
                done
              else
                echo "::warning::Скрипт $S завершился с ошибкой"
                if [ -n "${DEVICE:-}" ]; then
                  exit 1
                fi
              fi
            done

            if [ "$BUILT" -eq 0 ]; then
              echo "::error::Ни один скрипт сборки не отработал успешно"
              exit 1
            fi
          fi

      - name: Collect UEFI images
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p artifacts/UEFI-IMG artifacts/FIRMWARE-FILES

          echo "=== Searching for firmware images ==="
          while IFS= read -r -d '' file; do
            relative="${file#./}"
            safe_name="${relative//\//__}"

            case "$file" in
              *.img)
                cp -f "$file" "artifacts/UEFI-IMG/$safe_name"
                echo "IMG: $file"
                ;;
              *.img.gz|*.img.gz-dtb|*.fd)
                cp -f "$file" "artifacts/FIRMWARE-FILES/$safe_name"
                echo "FIRMWARE: $file"
                ;;
            esac
          done < <(
            find . -type f \
              \( -name '*.img' -o -name '*.img.gz' -o -name '*.img.gz-dtb' -o -name '*.fd' \) \
              -not -path '*/.git/*' \
              -not -path './artifacts/*' \
              -size +0c \
              -print0
          )

          echo "=== Collected files ==="
          find artifacts -type f -printf '%p (%s bytes)\n' | sort

          if ! find artifacts/UEFI-IMG -type f -name '*.img' -size +0c | grep -q .; then
            echo "::error::Готовый .img не найден. Проверьте лог Build firmware: скрипт устройства должен сам создавать UEFI .img."
            exit 1
          fi

      - name: Upload UEFI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UEFI-IMG
          path: artifacts/
          if-no-files-found: warn
          compression-level: 0
